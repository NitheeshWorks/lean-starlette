name = "LeanItsdangerous"
git = "https://github.com/NitheeshWorks/lean-itsdangerous"
rev = "main"

[[require]]
name = "LeanHttpx"
git = "https://github.com/NitheeshWorks/lean-httpx"
rev = "main"

[[require]]
name = "LeanJinja2"
git = "https://github.com/NitheeshWorks/lean-jinja2"
rev = "main"

[[require]]
name = "Keel"
git = "https://github.com/NitheeshWorks/lean-keel"
rev = "main"
