    name = "LeanStarlette"
    version = "0.1.0"
    defaultTargets = ["LeanStarlette", "props", "conformance"]

    # The verified library. Everything under LeanStarlette/ except Transport.lean is a
    # total function and the proof surface; see CONTRIBUTING.md.
    [[lean_lib]]
    name = "LeanStarlette"

    # Test modules the executables import (not part of the library).
    [[lean_lib]]
    name = "TestSupport"
    roots = ["tests.MiddlewareUsage", "tests.MiddlewareCases"]

    # Property tests for what is tested rather than proved. No dependencies, runs
    # in well under a second: `lake exe props [seed]`.
    [[lean_exe]]
    name = "props"
    root = "tests.Props"

    # Conformance cases re-expressed from the upstream test suite:
    # `lake exe conformance`. Each case names the upstream test it mirrors.
    [[lean_exe]]
    name = "conformance"
    root = "tests.Conformance"

    # Peak memory for a large JSON body end to end (not a default target):
    # `lake build bench && /usr/bin/time -v .lake/build/bin/bench array 20`.
    [[lean_exe]]
    name = "bench"
    root = "tests.Bench"

[[require]]
name = "LeanJson"
git = "https://github.com/NitheeshWorks/lean-json"
rev = "main"

