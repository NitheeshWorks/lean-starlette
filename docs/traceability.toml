# Traceability register: upstream behaviour -> Lean symbol -> theorem -> test.
#
# `scripts/traceability-check.py` validates it on every CI run: every
# `realises`/`theorem` symbol must resolve, every `test` path must exist.
#
# status: implemented | partial | tested | excluded | deviation
#   implemented  realised and proved
#   partial      realised, proof incomplete or covering a subset
#   tested       realised, deliberately tested rather than proved (say why)
#   excluded     out of scope, rejected by name
#   deviation    behaviour differs from upstream on purpose (say how)

[meta]
upstream_name = "Starlette"
upstream_url = "https://github.com/Kludex/starlette"
upstream_commit = "b7901fb908f0c6c3b8b6e495517cea6b2e77e66b"
upstream_license = "BSD-3-Clause"

# [[requirement]]
# id = "..."                  # stable id, e.g. "routing.first-match"
# upstream = "tests/test_x.py::test_y"   # or a docs section
# title = "..."
# status = "implemented"
# realises = ["LeanStarlette.Foo.bar"]
# theorem = ["LeanStarlette.Foo.bar_spec"]
# test = ["tests/Conformance.lean::name"]

[[requirement]]
id = "routing.templates"
upstream = "tests/test_routing.py::test_route_converters"
title = "Path templates with str/int/float/uuid/path convertors (Keel.Route), whole-path anchored"
status = "implemented"
realises = ["Keel.PathTemplate.compile", "Keel.PathTemplate.match", "LeanStarlette.Routing.Route", "LeanStarlette.compileOr"]
theorem = ["LeanStarlette.compile_match_url_path_for", "LeanStarlette.urlPathFor_match", "Keel.PathTemplate.match_urlFor", "Keel.PathTemplate.urlFor_match"]
test = ["tests/Conformance.lean::routingCases", "tests/Conformance.lean::convertorCases"]

[[requirement]]
id = "routing.trailing-newline"
upstream = "starlette/routing.py:compile_path (UP-030)"
title = "A route matches the whole path; '/about%0A' is not '/about' (upstream's '$' matches before a final newline)"
status = "deviation"
realises = ["Keel.PathTemplate.match"]
test = ["tests/Conformance.lean::transportCases"]

[[requirement]]
id = "routing.url-path-for"
upstream = "tests/test_routing.py::test_url_path_for"
title = "url_path_for through routes and named/unnamed mounts, NoMatchFound and to_string assertions as none"
status = "implemented"
realises = ["LeanStarlette.BaseRoute.urlPathFor", "LeanStarlette.urlPathForList", "LeanStarlette.Application.urlPathFor", "LeanStarlette.URLPath.makeAbsoluteURL"]
theorem = ["LeanStarlette.compile_match_url_path_for"]
test = ["tests/Conformance.lean::routingCases", "tests/Props.lean::properties"]

[[requirement]]
id = "routing.float-exact"
