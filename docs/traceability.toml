upstream = "uvicorn 0.54 (httptools) + Starlette 1.8.0, measured on the same raw requests"
title = "Server defaults match uvicorn's effective limits: any number of query parameters, invalid escapes reach QueryParams raw, any number of headers, targets up to 65535 bytes; the router's Allow policy is selected explicitly (.unionOfPartials)"
status = "tested"
realises = ["LeanStarlette.transportConfig", "LeanStarlette.rewriteHead", "LeanStarlette.readHead", "LeanStarlette.serveOne", "LeanStarlette.requestOfHead", "LeanStarlette.Router.resolve"]
test = ["tests/Conformance.lean::socketCases"]

[[requirement]]
id = "transport.limits"
upstream = "uvicorn 0.54: h11/httptools limits"
title = "Remaining limits, each answered with a status and a body: target over 65535 bytes is 414 (uvicorn: 400), head over 1 MiB is 431 (uvicorn: unlimited), body over the config maxBodySize (64 MiB default) or the app's max_body_size is 413 (uvicorn: unlimited), no Host is 400 (RFC 9112 3.2; uvicorn: 200), one request per connection (keep-alive off: the transport rewrites only the first request line), head timeout 408"
status = "deviation"
