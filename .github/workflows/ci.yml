name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The gate: the library and both test executables build, no proof is
  # admitted, and every theorem reaches only Lean's three axioms.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with: { test: false, lint: false }
      - name: The gate is the pinned copy of stack-tools/Axioms.lean
        run: echo "$(cat scripts/Axioms.sha256)  scripts/Axioms.lean" | sha256sum --check
      - name: Verification gate (axioms, sorry/admit, partial, unsafe, implemented_by, extern)
        run: lake exe axioms LeanStarlette
      - name: Property tests
        run: lake exe props
      - name: Conformance
        run: lake exe conformance
      - name: Traceability
        run: python3 scripts/traceability-check.py
      - name: Hostile form uploads (time and memory bounds)
        run: scripts/bench.sh

  plausible:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with: { test: false, lint: false }
      - name: Build and run the plausible suite
        working-directory: tests/pbt
        run: |
          lake build
          ./.lake/build/bin/pbt
